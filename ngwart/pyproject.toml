[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ngwart"
version = "2.0.0"
description = "Functional test sequencer for end-of-line PCBA testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Diogo Martins" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.13"]
vision = ["numpy>=1.24", "opencv-python>=4.8"]
dev = ["pytest>=7.4"]
# Everything a bench station needs:
#   pip install -e ".[all]"
all = [
    "PySide6>=6.5", "pyserial>=3.5", "pyvisa>=1.13",
    "numpy>=1.24", "opencv-python>=4.8", "pytest>=7.4",
]

[project.scripts]
ngwart = "ngwart.cli:main"

[tool.setuptools.packages.find]
include = ["ngwart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
