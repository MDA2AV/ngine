  path.binary:          '1,0,24'
  path.log:             '5,0,23'
  path.data:            '5,1,23'
  path.xml:             '6,0,23'

  # supply current, per UUT (value / result / test id)
  uut0.i_on.value:      '0,0,0'
  uut0.i_on.result:     '0,1,0'
  uut0.i_on.id:         '0,2,0'
