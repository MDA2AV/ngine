exec:

  # ----------------------------------------------------------------------
  # TOP  --  Start
  # ----------------------------------------------------------------------
  - [Flow, LABEL, TOP, Start, '', '#689ed7', '', '', '', yellow]
  - [UI, GRID1, Clear, '', '', '', '', UI_EX, '', Clear GRID1]
  - [UI, GRID2, Clear, '', '', '', '', UI_EX, '', Clear GRID2]
  - [UI, GRID3, Clear, '', '', '', '', UI_EX]
  - [UI, GRID4, Clear, '', '', '', '', UI_EX]
  - []
  - [UI, LBOX, Clear, '', '', '', '', UI_EX, '', Clear LISTBOX]
  - [UI, BCODE1, Clear, '', '', '', '', UI_EX, '', Clear BCODE1]
  - [UI, BCODE2, Clear, '', '', '', '', UI_EX, '', Clear BCODE2]
  - [UI, RESETPBARCOLOR, '', '', '', '', '', UI_EX, '', Reset Pbar color]
  - []
  - [TestData, STARTALIVE, '', '', '', '', '', '', '', Restart Alive]
  - [TestData, INITDATA, '40', '3', '30', '', '', '', '', Initialize Data Array]
  - []
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 1', '', '', '', VISA_EX, '', Select CH1]
  - [VISA, WRITE, DP2A243200206, VOLT 0V, '', '', '', VISA_EX, '', 'Set Output @ 0VDC']
  - [VISA, WRITE, DP2A243200206, CURR 0A, '', '', '', VISA_EX, '', 'Set max current Output @ 0A']
  - [VISA, WRITE, DP2A243200206, OUTP OFF, '', '', '', VISA_EX, '', Set Output OFF]
  - []
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 2', '', '', '', VISA_EX, '', Select CH2]
  - [VISA, WRITE, DP2A243200206, VOLT 0V, '', '', '', VISA_EX, '', 'Set Output @ 0VDC']
  - [VISA, WRITE, DP2A243200206, CURR 0A, '', '', '', VISA_EX, '', 'Set max current Output @ 0A']
  - [VISA, WRITE, DP2A243200206, OUTP OFF, '', '', '', VISA_EX, '', Set Output OFF]
  - []
  - [Serial, EXCHANGELINE_LVS, CONTROL, r/n, Outputs Reset, '5', '', SERIAL_EX, '', Reset control board]
  - []
  - [Serial, EXCHANGEBYTES_LVS, D1, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX, '', Reset DENKOVI 1]
  - [Serial, EXCHANGEBYTES_LVS, D2, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX, '', Reset DENKOVI 2]
  - []
  - ['', LOG_FLAG, 'OFF']
  - []

  # ----------------------------------------------------------------------
  # DETECTION  --  Insert PCBA
  # ----------------------------------------------------------------------
  - [Flow, LABEL, DETECTION, Insert PCBA, '', '', '', '', '', yellow]
  - [Serial, EXCHANGELINE_LT_LV0, CONTROL, d/n, '', '', det.insert, SERIAL_EX]
  - [Flow, DELAY, '0.1', '', '', '', '', FLOW_EX]
  - [Flow, JL, DETECTION, '*det.insert', '16', '', '', SERIAL_EX]
  - []
  - [Cargo, VALIDATE_DET, '*det.insert', '', '', '', '', BANANAS]
  - []

  # ----------------------------------------------------------------------
  # START  --  Test started
  # ----------------------------------------------------------------------
  - [Flow, LABEL, START, Test started, '', '', '', '', '', yellow]
  - [TestData, LOG_FLAG, 'ON']
  - [Flow, RESET_TIMER]
  - [Flow, ENABLE_TIMER]
  - [Flow, START_TIME, run.started]
  - []
  - [TestData, SETDATACODES, run.datecode, run.timecode, '', '', '', '', '', Set Datacodes]
  - []
  - [Flow, STOREF, 'C:\Users\Admin.ONTPC12\Desktop\Logs\CARGO\;*run.datecode', path.day, '', '', '', FLOW_EX, '', Save PATH0]
  - [Flow, STOREF, 'C:\Users\Admin.ONTPC12\Desktop\Logs\CARGO\%0\%1;*run.datecode;*run.timecode', path.run, '', '', '', FLOW_EX, '', Save PATH1]
  - [Flow, STOREF, '%0\Captures;*path.run', path.captures, '', '', '', FLOW_EX, '', Save PATH2]
  - [Flow, STOREF, '%0\Binary_Captures;*path.run', path.binary, '', '', '', FLOW_EX, '', Save PATH3]
  - [Flow, CREATEDIR, '*path.day', '', '', '', '', FLOW_EX]
  - [Flow, CREATEDIR, '*path.run', '', '', '', '', FLOW_EX]
  - [Flow, CREATEDIR, '*path.captures', '', '', '', '', FLOW_EX]
  - [Flow, CREATEDIR, '*path.binary', '', '', '', '', FLOW_EX]
  - [Flow, STOREF, 'C:\Users\Admin.ONTPC12\Desktop\Logs_XML', path.xml, '', '', '', FLOW_EX]
  - []

  # ----------------------------------------------------------------------
  # INITIAL_CONDITIONS
  # ----------------------------------------------------------------------
  - [Flow, LABEL, INITIAL_CONDITIONS, '', '', '', '', '', '', yellow]
  - [Serial, EXCHANGEBYTES_LVS, D2, '49,49,43,47,47', '49,49,43,47,47', '5,5', '', SERIAL_EX, '', 'EIMAN 3+ ON –> DVI2 K11 ON']
  - [Serial, EXCHANGEBYTES_LVS, D1, '49,52,43,47,47', '49,52,43,47,47', '5,5', '', SERIAL_EX, '', 'EIMAN 3- ON –> DVI1 K14 ON']
  - [Serial, EXCHANGEBYTES_LVS, D2, '49,50,43,47,47', '49,50,43,47,47', '5,5', '', SERIAL_EX, '', 'EIMAN 4+ ON –> DVI2 K12 ON']
  - [Serial, EXCHANGEBYTES_LVS, D1, '49,51,43,47,47', '49,51,43,47,47', '5,5', '', SERIAL_EX, '', 'EIMAN 4– ON –> DVI1 K13 ON']
  - [Flow, DELAY, '1', '', '', '', '', FLOW_EX]
  - [Serial, EXCHANGEBYTES_LVS, D1, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX, '', Reset DENKOVI 1]
  - [Serial, EXCHANGEBYTES_LVS, D2, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX, '', Reset DENKOVI 2]
  - []

  # ----------------------------------------------------------------------
  # POWER  --  Powering units
  # ----------------------------------------------------------------------
  - [Flow, LABEL, POWER, Powering units, '', '', '', '', '', yellow]
  - []
  - [Serial, EXCHANGEBYTES_LVS, D2, '48,49,43,47,47', '48,49,43,47,47', '5,5', '', SERIAL_EX, '1', 'CH1 + ON –> DVI2 K1 ON – UUT 2']
  - [Serial, EXCHANGEBYTES_LVS, D2, '48,50,43,47,47', '48,50,43,47,47', '5,5', '', SERIAL_EX, '1', 'CH1 – ON –> DVI2 K2 ON – UUT 2']
  - [Serial, EXCHANGEBYTES_LVS, D2, '48,51,43,47,47', '48,51,43,47,47', '5,5', '', SERIAL_EX, '0', 'CH2 + ON –> DVI2 K3 ON – UUT 1']
  - [Serial, EXCHANGEBYTES_LVS, D2, '48,52,43,47,47', '48,52,43,47,47', '5,5', '', SERIAL_EX, '0', 'CH2 – ON –> DVI2 K4 ON – UUT 1']

  # ----------------------------------------------------------------------
  # POWER1
  # ----------------------------------------------------------------------
  - [Flow, LABEL, POWER1]
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 1', '', '', '', VISA_EX, '1', Select CH1]
  - [VISA, WRITE, DP2A243200206, VOLT 13.5V, '', '', '', VISA_EX, '1', 'Set Output @ 13.5VDC']
  - [VISA, WRITE, DP2A243200206, CURR 1A, '', '', '', VISA_EX, '1', 'Set max current Output @ 1A']
  - [VISA, WRITE, DP2A243200206, OUTP ON, '', '', '', VISA_EX, '1', Set Output ON]
  - []
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 2', '', '', '', VISA_EX, '0', Select CH2]
  - [VISA, WRITE, DP2A243200206, VOLT 13.5V, '', '', '', VISA_EX, '0', 'Set Output @ 13.5VDC']
  - [VISA, WRITE, DP2A243200206, CURR 1A, '', '', '', VISA_EX, '0', 'Set max current Output @ 1A']
  - [VISA, WRITE, DP2A243200206, OUTP ON, '', '', '', VISA_EX, '0', Set Output ON]
  - []

  # ----------------------------------------------------------------------
  # CURR_ON_1_2  --  Current On 1,2
  # ----------------------------------------------------------------------
  - [Flow, LABEL, CURR_ON_1_2, 'Current On 1,2', '', '', '', '', '', yellow]
  - [VISA, MEASURE, DP2A243200206, 'MEAS:CURR? CH1', '', uut1.i_on.value, '', VISA_EX, '1', Measure UUT 2 current On]
  - [VISA, MEASURE, DP2A243200206, 'MEAS:CURR? CH2', '', uut0.i_on.value, '', VISA_EX, '0', Measure UUT 1 current On]
  - []
  - [Flow, EVAFLOAT, '0,1', '*uut0.i_on.value', 'uut0.i_on.value;uut0.i_on.result;uut0.i_on.id', min, '0,CURRON1', FLOW_EX, '0', Evaluate UUT1 Current On]
  - [Flow, EVAFLOAT, '0,1', '*uut1.i_on.value', 'uut1.i_on.value;uut1.i_on.result;uut1.i_on.id', min, '1,CURRON1', FLOW_EX, '1', Evaluate UUT2 Current On]
  - []

  # ----------------------------------------------------------------------
  # ON_LEDS_1_2  --  LEDs On 1,2
  # ----------------------------------------------------------------------
  - [Flow, LABEL, ON_LEDS_1_2, 'LEDs On 1,2', '', '', '', '', '', yellow]
  - [Flow, STOREF, '%0\UUT_1_2_ON.jpg;*path.captures', img.u12_on.color, '', '', '', FLOW_EX, '0,1', Create Directory to save image]
  - [Flow, STOREF, '%0\UUT_1_2_ON.jpg;*path.binary', img.u12_on.binary, '', '', '', FLOW_EX, '0,1', Create Directory to save image]
  - [Camera, CAPTURE, UB101256, '*img.u12_on.color', '', '', '', CAM_EX, '0,1']
  - [Flow, DELAY, '0.1']
  - []
  - [ImageProcess, BGR2CONT, '', '*img.u12_on.color', img.u12_on.contours, '*img.u12_on.binary', '180', IMPRO_EX, '0,1', Extract Contours from image]
  - []
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '895,659,10,50,1', '0,0,1', min, '0,INTENSITY_A', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '878,659,10,50,1', '1,0,1', min, '0,INTENSITY_B', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '861,659,10,50,1', '2,0,1', min, '0,INTENSITY_C', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '845,659,10,50,1', '3,0,1', min, '0,INTENSITY_D', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '828,658,10,50,1', '4,0,1', min, '0,INTENSITY_E', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - [ImageProcess, EVALCONT, '*img.u12_on.contours', '811,658,10,50,1', '5,0,1', min, '0,INTENSITY_F', IMPRO_EX, '0', Evaluate if any contour matches criteria]
  - []
