# NGWART native program -- generated from cargo.ods, then reviewed.
#
# Same steps, same order, same arguments as the legacy table. What is
# different is that the data store is addressed by name: see `vars`.
#
# Run it with:   ngwart run programs/cargo.yaml
#      check:    ngwart check programs/cargo.yaml

meta:
  name: cargo
  product: CARGO
  source: cargobay/src/TestTables/cargo.ods
  notes: >
    Four-up LED and current test. Paths, supply channels and camera
    serials are the ones the real fixture uses -- running this drives
    hardware unless --simulate is given.

modules:
  Flow: FlowManager
  UI: UIManager
  Cargo: CargoManager
  VISA: GlobalVISAManager
  Camera: BaluffManager
  Serial: WinSerialManager
  ImageProcess: ImageProcessManager

# The readability fix: names instead of raw l,c,p coordinates.
#
# Not used for the EVALCONT / EVALCONTN / EVALLEDS result columns: those
# take a single index that the engine expands into a value/result/id
# triple by splitting the text on commas, before names are resolved. A
# name there would store the measurement and drop the other two.
