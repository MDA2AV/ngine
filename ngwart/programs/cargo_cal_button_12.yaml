meta:
  name: cargo_cal_button_12
  product: CARGO
  revision: 1
  calibrates: programs/cargo.yaml
  sites: 'led.u[01].g.*'
  # The button indicator is a much smaller blob than A-F. Lowered from the
  # runtime's 50 px so it can be clicked at all. Safe here because these
  # sites are judged with EVALCONTN, which passes when nothing is found --
  # the coordinate marks where the indicator is, it is not something a
  # limit is measured against. Do NOT lower it for an EVALCONT site.
  min_area: 5
  title: Button LED - UUT 1+2
  notes: >
    Calibration capture for the button indicator on UUT 1 and 2. Sequence, each block copied from cargo.yaml by label: EIMAN to its initial position (INITIAL_CONDITIONS), power UUT 1 and 2 (POWER), press the buttons on 1 and 2 (EIMAN_1_2), then LIFT the armature clear (BUTTON_LED_1_2), then capture at 30000 us. The lift matters: without it the shutter opens on a magnet sitting over the button. It pulses the OTHER pair's coils (3+4), which is what cargo.yaml does immediately before its own button capture. Only two of the four are powered, so this covers two sites; UUT 3 and 4 are done by cargo_cal_button_34.yaml.

modules:
  Flow: FlowManager
  UI: UIManager
  Cargo: CargoManager
  VISA: GlobalVISAManager
  Camera: BaluffManager
  Serial: WinSerialManager
  ImageProcess: ImageProcessManager

vars:
  img.path:      '2,0,0'
  img.color:     '0,0,0'
  img.binary:    '0,1,0'
  img.contours:  '0,2,0'

config:
  - ['TestData', 'initAlive', '4', '', '', '', '', '', '', 'gray']
  - ['TestData', 'updateLabels', '', '', '', '', '', '', '', 'gray']
  - ['Serial', 'FINDPORT', '115200,1', '066CFF3833554B3043165348 LOCATION=1-1:x.2', 'CONTROL', '', '', '', '', 'gray']
  - ['Serial', 'FINDPORT', '9600,1', 'DAE006GCA', 'D1', '', '', '', '', 'gray']
  - ['Serial', 'FINDPORT', '9600,1', 'DAE00646A', 'D2', '', '', '', '', 'gray']
  - ['Serial', 'OPEN', 'CONTROL', '', '', '', '', '', '', 'gray']
  - ['Serial', 'OPEN', 'D1', '', '', '', '', '', '', 'gray']
  - ['Serial', 'OPEN', 'D2', '', '', '', '', '', '', 'gray']
  - ['VISA', 'OPENALL', '10000', '1', '', '', '', '', '', 'gray']
  - ['Camera', 'OPENALL', '', '', '', '', '', '', '', 'gray']
  - ['Camera', 'SETPROPS', 'UB101256', '4,1296,972', '0,0', '0,120', '0,100,0,0', '', '', 'gray']
  - ['Camera', 'CALIBRATEWB', 'UB101256', '50000', '', '', '', '', '', 'gray']

exec:
  - [Flow, LABEL, START, 'BUTTON LED - UUT 1+2', '', '#4C9AFF', '', '', '', yellow]
  - [TestData, STARTALIVE]
  - [TestData, INITDATA, '40', '3', '32']
  - [Flow, CREATEDIR, 'debug/teach', '', '', '', '', FLOW_EX]
  - [Flow, STORE, 'debug/teach/button_12.jpg', '*img.path', '', '', '', FLOW_EX]
  - [Flow, STORE, 'debug/teach/button_12_bin.jpg', '*img.binary', '', '', '', FLOW_EX]

  # --- EIMAN to its initial position (cargo INITIAL_CONDITIONS) ---------
  # Drives 3+4 -- the lift coil for this pair -- then the reset releases it.
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,49,43,47,47', '49,49,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3+ ON > DVI2 K11 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,52,43,47,47', '49,52,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3- ON > DVI1 K14 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,50,43,47,47', '49,50,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4+ ON > DVI2 K12 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,51,43,47,47', '49,51,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4 ON > DVI1 K13 ON']
  - ['Flow', 'DELAY', '1', '', '', '', '', 'FLOW_EX']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '111,102,102,47,47', '111,102,102,47,47', '5,5', '', 'SERIAL_EX', '', 'Reset DENKOVI 1']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '111,102,102,47,47', '111,102,102,47,47', '5,5', '', 'SERIAL_EX', '', 'Reset DENKOVI 2']

  # --- power UUT 1 and 2 (cargo POWER) ----------------------------------
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,49,43,47,47', '48,49,43,47,47', '5,5', '', 'SERIAL_EX', '1', 'CH1 + ON > DVI2 K1 ON  UUT 2']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,50,43,47,47', '48,50,43,47,47', '5,5', '', 'SERIAL_EX', '1', 'CH1  ON > DVI2 K2 ON  UUT 2']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,51,43,47,47', '48,51,43,47,47', '5,5', '', 'SERIAL_EX', '0', 'CH2 + ON > DVI2 K3 ON  UUT 1']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,52,43,47,47', '48,52,43,47,47', '5,5', '', 'SERIAL_EX', '0', 'CH2  ON > DVI2 K4 ON  UUT 1']
  - ['VISA', 'WRITE', 'DP2A243200206', 'INST:NSEL 1', '', '', '', 'VISA_EX', '1', 'Select CH1']
  - ['VISA', 'WRITE', 'DP2A243200206', 'VOLT 13.5V', '', '', '', 'VISA_EX', '1', 'Set Output @ 13.5VDC']
  - ['VISA', 'WRITE', 'DP2A243200206', 'CURR 1A', '', '', '', 'VISA_EX', '1', 'Set max current Output @ 1A']
  - ['VISA', 'WRITE', 'DP2A243200206', 'OUTP ON', '', '', '', 'VISA_EX', '1', 'Set Output ON']
  - ['VISA', 'WRITE', 'DP2A243200206', 'INST:NSEL 2', '', '', '', 'VISA_EX', '0', 'Select CH2']
  - ['VISA', 'WRITE', 'DP2A243200206', 'VOLT 13.5V', '', '', '', 'VISA_EX', '0', 'Set Output @ 13.5VDC']
  - ['VISA', 'WRITE', 'DP2A243200206', 'CURR 1A', '', '', '', 'VISA_EX', '0', 'Set max current Output @ 1A']
  - ['VISA', 'WRITE', 'DP2A243200206', 'OUTP ON', '', '', '', 'VISA_EX', '0', 'Set Output ON']

  # --- press the buttons on 1 and 2 (cargo EIMAN_1_2) -------------------
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,57,43,47,47', '48,57,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 1+ ON > DVI2 K9 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,54,43,47,47', '49,54,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 1- ON > DVI1 K16 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,48,43,47,47', '49,48,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 2+ ON > DVI2 K10 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,53,43,47,47', '49,53,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 2 ON > DVI1 K15 ON']
  - ['Flow', 'DELAY', '1', '', '', '', '', 'FLOW_EX']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '48,57,45,47,47', '48,57,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 1+ ON > DVI2 K9 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,54,45,47,47', '49,54,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 1- ON > DVI1 K16 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,48,45,47,47', '49,48,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 2+ ON > DVI2 K10 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,53,45,47,47', '49,53,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 2 ON > DVI1 K15 OFF']

  # --- lift the armature clear (cargo BUTTON_LED_1_2) -------------------
  # Without this the shutter opens on a magnet sitting over the button.
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,49,43,47,47', '49,49,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3+ ON > DVI2 K11 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,52,43,47,47', '49,52,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3- ON > DVI1 K14 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,50,43,47,47', '49,50,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4+ ON > DVI2 K12 ON']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,51,43,47,47', '49,51,43,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4 ON > DVI1 K13 ON']
  - ['Flow', 'DELAY', '1', '', '', '', '', 'FLOW_EX']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,49,45,47,47', '49,49,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3+ OFF > DVI2 K11 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,52,45,47,47', '49,52,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 3- OFF > DVI1 K14 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D2', '49,50,45,47,47', '49,50,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4+ OFF > DVI2 K12 OFF']
  - ['Serial', 'EXCHANGEBYTES_LVS', 'D1', '49,51,45,47,47', '49,51,45,47,47', '5,5', '', 'SERIAL_EX', '', 'EIMAN 4 OFF > DVI1 K13 OFF']

  # --- the picture ------------------------------------------------------
  # 30000 us: the button indicator is far dimmer than A-F. Threshold 100 is
  # cargo.yaml's own for this indicator, so the blob is judged the same way.
  - [Flow, LABEL, CAPTURE_FRAME, 'CAPTURING', '', '#4C9AFF', '', '', '', yellow]
  - [Camera, SETEXPOSURE, UB101256, '30000', '', '', '', CAM_EX]
  - [Flow, DELAY, '0.3', '', '', '', '', FLOW_EX, '', 'let the sensor settle']
  - [Camera, CAPTURE, UB101256, '*img.path', '*img.color', '', '', CAM_EX, '', 'save it, and keep it in memory']
  - [Flow, DELAY, '0.1', '', '', '', '', FLOW_EX]
  - [ImageProcess, BGR2CONT, '*img.color', '', img.contours, '*img.binary', '100', IMPRO_EX]
  - [Camera, SETEXPOSURE, UB101256, '120', '', '', '', CAM_EX, '', 'back to normal']
  - [Flow, J, DONE]

ehandling:
  - [Flow, LABEL, FLOW_EX, 'FLOW FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, SERIAL_EX, 'SERIAL FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, VISA_EX, 'INSTRUMENT FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, CAM_EX, 'CAMERA FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, IMPRO_EX, 'VISION FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, STD_EX, 'SYSTEM FAILURE', '', '#E5484D', '', '', '', red]
  - [Flow, J, DONE]
  - [Flow, LABEL, DONE, '', '', '', '', '', '', gray]

# Runs on pass, fail, stop or crash. The operator then spends time clicking, and
# this is what makes that safe: supplies off, every relay open, magnets released.
teardown:
  - [Camera, SETEXPOSURE, UB101256, '120', '', '', '', '', '', 'leave the camera as found']
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 1', '', '', '', '', '', 'select channel 1']
  - [VISA, WRITE, DP2A243200206, 'OUTP OFF', '', '', '', '', '', 'de-energise CH1']
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 2', '', '', '', '', '', 'select channel 2']
  - [VISA, WRITE, DP2A243200206, 'OUTP OFF', '', '', '', '', '', 'de-energise CH2']
  - [Serial, EXCHANGEBYTES_LVS, D1, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', '', '', 'open all D1 relays -- releases every magnet']
  - [Serial, EXCHANGEBYTES_LVS, D2, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', '', '', 'open all D2 relays']
