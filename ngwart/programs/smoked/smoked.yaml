# NGWART native program -- derived from cargo, for a two-board fixture.
#
# The same modules, the same relays, the same camera. What is gone is the
# electromagnet and the button indicator, which this fixture does not have,
# and with them everything cargo does after its first frame.
#
# Run it with:   ngwart run programs/smoked/smoked.yaml
#      check:    ngwart check programs/smoked/smoked.yaml

meta:
  name: smoked
  product: SMOKED
  source: programs/cargo/cargo.yaml
  notes: >
    Two-up LED test. Power both boards, measure the supply current, take
    one frame, and check six indicators per board for brightness and
    colour. Paths, supply channels and camera serials are the ones the
    real fixture uses -- running this drives hardware unless --simulate
    is given.

modules:
  Flow: FlowManager
  UI: UIManager
  Cargo: CargoManager
  VISA: GlobalVISAManager
  Camera: BaluffManager
  Serial: WinSerialManager
  ImageProcess: ImageProcessManager

# The readability fix: names instead of raw l,c,p coordinates.
#
# Not used for the EVALCONT / EVALCONTN / EVALLEDS result columns: those
# take a single index that the engine expands into a value/result/id
# triple by splitting the text on commas, before names are resolved. A
# name there would store the measurement and drop the other two.
values: programs/smoked/smoked-values.json

vars:
  # board detection
  det.insert:           '0,0,20'
  det.remove:           '1,0,20'

  # run identity and output paths
  run.datecode:         '2,0,23'
  run.timecode:         '3,0,23'
  run.started:          '38,0,29'
  path.day:             '4,1,23'
  path.run:             '4,0,23'
  path.captures:        '0,0,24'
  path.binary:          '1,0,24'
  path.log:             '5,0,23'
  path.data:            '5,1,23'
  path.xml:             '6,0,23'

  # supply current, per UUT (value / result / test id)
  uut0.i_on.value:      '0,0,0'
  uut0.i_on.result:     '0,1,0'
  uut0.i_on.id:         '0,2,0'
  uut1.i_on.value:      '1,0,0'
  uut1.i_on.result:     '1,1,0'
  uut1.i_on.id:         '1,2,0'

  # capture slots: colour file, thresholded file, contours
  img.u12_on.color:     '0,0,25'
  img.u12_on.binary:    '1,0,25'
  img.u12_on.contours:  '0,1,25'

  # --- camera ---
  # White-balance gains, measured once by Tools > Calibrate > White balance
  # against LIT indicators. CALIBRATEWB at config time grey-worlds a bare
  # unpowered fixture and pulls green down to neutralise the solder mask,
  # which left every indicator ~25 counts green-deficient.
  cam.wb:               ['39,2,30', 'cam.wb']

  # --- LED geometry -----------------------------------------------------
  # Each variable names the key it takes its value from in the values file
  # above. INITDATA writes them into their cells, so they are set before
  # the first step runs and again after the per-board re-init at TOP --
  # static for the whole session, with nothing in <Config> to set up.
  #
  # Tools > Calibrate rewrites the JSON. This table is not touched by a
  # re-measure, and the tolerances below stay where they were qualified.

  led.u0.a.cont:        ['0,0,30', 'led.u0.a.cont']      # INTENSITY_A/COLOR_A
  led.u0.a.leds:        ['0,1,30', 'led.u0.a.leds']
  led.u0.b.cont:        ['1,0,30', 'led.u0.b.cont']      # INTENSITY_B/COLOR_B
  led.u0.b.leds:        ['1,1,30', 'led.u0.b.leds']
  led.u0.c.cont:        ['2,0,30', 'led.u0.c.cont']      # INTENSITY_C/COLOR_C
  led.u0.c.leds:        ['2,1,30', 'led.u0.c.leds']
  led.u0.d.cont:        ['3,0,30', 'led.u0.d.cont']      # INTENSITY_D/COLOR_D
  led.u0.d.leds:        ['3,1,30', 'led.u0.d.leds']
  led.u0.e.cont:        ['4,0,30', 'led.u0.e.cont']      # INTENSITY_E/COLOR_E
  led.u0.e.leds:        ['4,1,30', 'led.u0.e.leds']
  led.u0.f.cont:        ['5,0,30', 'led.u0.f.cont']      # INTENSITY_F/COLOR_F
  led.u0.f.leds:        ['5,1,30', 'led.u0.f.leds']

  led.u1.a.cont:        ['7,0,30', 'led.u1.a.cont']      # INTENSITY_A/COLOR_A
  led.u1.a.leds:        ['7,1,30', 'led.u1.a.leds']
  led.u1.b.cont:        ['8,0,30', 'led.u1.b.cont']      # INTENSITY_B/COLOR_B
  led.u1.b.leds:        ['8,1,30', 'led.u1.b.leds']
  led.u1.c.cont:        ['9,0,30', 'led.u1.c.cont']      # INTENSITY_C/COLOR_C
  led.u1.c.leds:        ['9,1,30', 'led.u1.c.leds']
  led.u1.d.cont:        ['10,0,30', 'led.u1.d.cont']      # INTENSITY_D/COLOR_D
  led.u1.d.leds:        ['10,1,30', 'led.u1.d.leds']
  led.u1.e.cont:        ['11,0,30', 'led.u1.e.cont']      # INTENSITY_E/COLOR_E
  led.u1.e.leds:        ['11,1,30', 'led.u1.e.leds']
  led.u1.f.cont:        ['12,0,30', 'led.u1.f.cont']      # INTENSITY_F/COLOR_F
  led.u1.f.leds:        ['12,1,30', 'led.u1.f.leds']


  # --- LED results ------------------------------------------------------
  # Where each optical check writes its value / verdict / test-id triple.
  # One name per (board, check, indicator). There is one frame, read twice:
  # `on` is the contour pass over the thresholded image, `color` the
  # EVALLEDS pass over the same colour frame.
  #
  # The numbering has gaps. It is cargo's, kept so that a data file from
  # either product puts the same test on the same line.
  #
  # The verb derives the other two cells by incrementing the column, so
  # these name the first of the three.

  res.u0.color.color_a:     '6,0,1'
  res.u0.color.color_b:     '7,0,1'
  res.u0.color.color_c:     '8,0,1'
  res.u0.color.color_d:     '9,0,1'
  res.u0.color.color_e:     '10,0,1'
  res.u0.color.color_f:     '11,0,1'
  res.u0.on.intensity_a:    '0,0,1'
  res.u0.on.intensity_b:    '1,0,1'
  res.u0.on.intensity_c:    '2,0,1'
  res.u0.on.intensity_d:    '3,0,1'
  res.u0.on.intensity_e:    '4,0,1'
  res.u0.on.intensity_f:    '5,0,1'

  res.u1.color.color_a:     '6,0,2'
  res.u1.color.color_b:     '7,0,2'
  res.u1.color.color_c:     '8,0,2'
  res.u1.color.color_d:     '9,0,2'
  res.u1.color.color_e:     '10,0,2'
  res.u1.color.color_f:     '11,0,2'
  res.u1.on.intensity_a:    '0,0,2'
  res.u1.on.intensity_b:    '1,0,2'
  res.u1.on.intensity_c:    '2,0,2'
  res.u1.on.intensity_d:    '3,0,2'
  res.u1.on.intensity_e:    '4,0,2'
  res.u1.on.intensity_f:    '5,0,2'


