  # That is the measurement: power on, one frame, one verdict per indicator.
  #
  # cargo carries on from here. It presses the buttons with the electromagnet,
  # re-reads the indicators dark, measures the idle current, checks the
  # button's own indicator at a longer exposure and reads everything a second
  # time -- then repeats all of it for boards 3 and 4. This fixture has no
  # electromagnet and no button indicator, so none of that is here.

  - [Flow, LABEL, VALIDATE, VALIDATE, '', '', '', FLOW_EX, '', yellow]
  - [Cargo, VALIDATE]
  - []

  # ----------------------------------------------------------------------
  # SHUTDOWN_ALL
  # ----------------------------------------------------------------------
  - [Flow, LABEL, SHUTDOWN_ALL, '', '', '', '', FLOW_EX, '', yellow]
  - []
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 1', '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, VOLT 0V, '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, CURR 0A, '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, OUTP OFF, '', '', '', VISA_EX]
  - []
  - [VISA, WRITE, DP2A243200206, 'INST:NSEL 2', '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, VOLT 0V, '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, CURR 0A, '', '', '', VISA_EX]
  - [VISA, WRITE, DP2A243200206, OUTP OFF, '', '', '', VISA_EX]
  - []
  - [Serial, EXCHANGELINE_LVS, CONTROL, r/n, Outputs Reset, '5', '', SERIAL_EX]
  - []
  - [Serial, EXCHANGEBYTES_LVS, D1, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX]
  - [Serial, EXCHANGEBYTES_LVS, D2, '111,102,102,47,47', '111,102,102,47,47', '5,5', '', SERIAL_EX]
  - []

  # ----------------------------------------------------------------------
  # SAVE
  # ----------------------------------------------------------------------
  - [Flow, LABEL, SAVE, '', '', '', '', FLOW_EX, '', yellow]
  - [Flow, STOREF, '%0\LOG.txt;*path.run', path.log, '', '', '', FLOW_EX]
  - [Flow, STOREF, '%0\DATA.txt;*path.run', path.data, '', '', '', FLOW_EX]
  - [TestData, SAVELOG, '*path.log']
  - [TestData, SAVEDATA, '*path.data']
  - []

  # ----------------------------------------------------------------------
  # END
  # ----------------------------------------------------------------------
  - [Flow, LABEL, END, '', '', '', '', FLOW_EX]
  - [Flow, DISABLE_TIMER]
  - []
  - [TestData, LOG_FLAG, 'OFF']
  - ['', J, TOP]

  # ----------------------------------------------------------------------
  # REMOVE
  # ----------------------------------------------------------------------
  - [Flow, LABEL, REMOVE, '', '', '', '', FLOW_EX, '', yellow]
  - [Serial, EXCHANGELINE_LT_LV0, CONTROL, d/n, '', '', det.remove, SERIAL_EX]
  - [Flow, JL, TOP, '*det.remove', '16', '', '', FLOW_EX]
  - [Flow, DELAY, '0.1', '', '', '', '', FLOW_EX]
  - [Flow, J, REMOVE]

